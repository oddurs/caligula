[package]
name = "caligula"
version = "0.1.0"
edition = "2024"
description = "A terminal browser for git worktrees: what they are, how stale they are, and what you would lose by deleting them"
license = "MIT"

[dependencies]
ratatui = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
