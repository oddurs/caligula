name: Feature request
description: Something caligula should do and does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Anything that becomes work becomes a [cairn
        item](https://github.com/oddurs/caligula/tree/main/cairn/items) — a record
        of the reasoning, not a title. This form asks for the same things an
        item asks for, so the two are one step apart.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What you cannot do today, or what is tedious. Not the feature — the
        situation that makes you want one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you think should happen. A rough shape is fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >
        A lens, a filter, a key, or git on the command line. If something
        already does this and it is just hard to find, that is a docs bug and
        worth knowing.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scan — walking the disk, roots, what gets found
        - git — reading repositories, the worktree model
        - verdict — staleness, and what a worktree is worth
        - chrome — the list, the detail pane, overlays
        - actions — remove, prune, lock, archive
        - config — the config file and keybindings
        - cli — flags and non-interactive output
        - not sure
    validations:
      required: false
